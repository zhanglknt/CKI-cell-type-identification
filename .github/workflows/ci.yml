name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 3.14 is the version of the verified analysis environment
        # (see CKI_Reproducibility_Guide_NC Section 1.1)
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[all]"
          pip install pytest flake8

      - name: Lint with flake8
        run: flake8 cki/ --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Run pytest
        run: pytest tests/ -v

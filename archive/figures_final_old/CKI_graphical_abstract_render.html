<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { 
      background: white; 
      display: flex; 
      justify-content: center; 
      align-items: flex-start; 
    }
    svg { 
      width: 1360px; 
      height: 1360px;
    }
  </style>
</head>
<body>
  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 680" width="1360" height="1360" role="img">
    <title>CKI: Cell type Kinship Index</title>
    <defs>
      <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
        <path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </marker>
      <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
        <path d="M2 1L8 5L2 9" fill="none" stroke="#185FA5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </marker>
      <marker id="arrow-coral" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
        <path d="M2 1L8 5L2 9" fill="none" stroke="#993C1D" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </marker>
      <marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
        <path d="M2 1L8 5L2 9" fill="none" stroke="#534AB7" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </marker>
    </defs>
    <style>
      .title { font-family: Arial, sans-serif; font-size: 16px; font-weight: 500; fill: #2C2C2A; text-anchor: middle; }
      .subtitle { font-family: Arial, sans-serif; font-size: 12px; font-weight: 400; fill: #5F5E5A; text-anchor: middle; }
      .label { font-family: Arial, sans-serif; font-size: 12px; font-weight: 500; fill: #2C2C2A; text-anchor: middle; }
      .sublabel { font-family: Arial, sans-serif; font-size: 10px; font-weight: 400; fill: #5F5E5A; text-anchor: middle; }
      .formula { font-family: 'Courier New', monospace; font-size: 18px; font-weight: 500; fill: #26215C; text-anchor: middle; }
      .caption { font-family: Arial, sans-serif; font-size: 11px; font-weight: 500; fill: #2C2C2A; text-anchor: middle; }
    </style>

    <rect width="680" height="680" fill="#FFFFFF"/>

    <text class="title" x="340" y="32">CKI: Cell type Kinship Index</text>
    <text class="subtitle" x="340" y="52">Quantifying functional selection in cellular transcriptomes</text>

    <g transform="translate(175, 100)">
      <circle cx="0" cy="0" r="18" fill="#B5D4F4" stroke="#378ADD" stroke-width="0.5"/>
      <circle cx="-8" cy="-12" r="6" fill="#85B7EB"/>
      <circle cx="10" cy="-8" r="5" fill="#85B7EB"/>
      <circle cx="12" cy="8" r="7" fill="#378ADD"/>
      <circle cx="-10" cy="10" r="5" fill="#85B7EB"/>
      <circle cx="2" cy="2" r="4" fill="#185FA5"/>
      <circle cx="-2" cy="-6" r="3" fill="#B5D4F4"/>
    </g>
    <text class="label" x="175" y="147">Cell type A</text>

    <g transform="translate(505, 100)">
      <circle cx="0" cy="0" r="18" fill="#F5C4B3" stroke="#D85A30" stroke-width="0.5"/>
      <circle cx="-8" cy="-12" r="6" fill="#F0997B"/>
      <circle cx="10" cy="-8" r="5" fill="#F0997B"/>
      <circle cx="12" cy="8" r="7" fill="#D85A30"/>
      <circle cx="-10" cy="10" r="5" fill="#F0997B"/>
      <circle cx="2" cy="2" r="4" fill="#993C1D"/>
      <circle cx="-2" cy="-6" r="3" fill="#F5C4B3"/>
    </g>
    <text class="label" x="505" y="147">Cell type B</text>

    <line x1="200" y1="100" x2="480" y2="100" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>
    <text class="sublabel" x="340" y="92">compare expression profiles</text>

    <line x1="175" y1="163" x2="175" y2="183" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>
    <line x1="505" y1="163" x2="505" y2="183" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>
    <line x1="175" y1="183" x2="340" y2="183" stroke="#5F5E5A" stroke-width="1"/>
    <line x1="505" y1="183" x2="340" y2="183" stroke="#5F5E5A" stroke-width="1"/>
    <line x1="340" y1="183" x2="340" y2="195" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>

    <rect x="270" y="200" width="140" height="36" rx="8" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.5"/>
    <g transform="translate(300, 218)">
      <rect x="0" y="-10" width="8" height="10" fill="#378ADD"/>
      <rect x="12" y="-6" width="8" height="6" fill="#85B7EB"/>
      <rect x="24" y="-14" width="8" height="14" fill="#378ADD"/>
      <rect x="36" y="-4" width="8" height="4" fill="#F0997B"/>
      <rect x="48" y="-12" width="8" height="12" fill="#D85A30"/>
      <rect x="60" y="-7" width="8" height="7" fill="#F0997B"/>
      <rect x="72" y="-9" width="8" height="9" fill="#85B7EB"/>
    </g>
    <text class="label" x="340" y="256">Pseudobulk expression profiles</text>

    <line x1="340" y1="268" x2="340" y2="282" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>

    <circle cx="340" cy="288" r="3" fill="#5F5E5A"/>
    <line x1="340" y1="288" x2="230" y2="312" stroke="#378ADD" stroke-width="1.2" marker-end="url(#arrow-blue)"/>
    <line x1="340" y1="288" x2="450" y2="312" stroke="#D85A30" stroke-width="1.2" marker-end="url(#arrow-coral)"/>

    <rect x="120" y="316" width="220" height="132" rx="12" fill="#E6F1FB" stroke="#85B7EB" stroke-width="0.5"/>
    <g transform="translate(150, 344)">
      <path d="M-12,-8 Q0,0 12,-8" fill="none" stroke="#378ADD" stroke-width="1.2"/>
      <path d="M-12,-2 Q0,6 12,-2" fill="none" stroke="#378ADD" stroke-width="1.2"/>
      <path d="M-12,4 Q0,12 12,4" fill="none" stroke="#378ADD" stroke-width="1.2"/>
      <line x1="-6" y1="-6" x2="-6" y2="10" stroke="#185FA5" stroke-width="1.5"/>
      <line x1="6" y1="-6" x2="6" y2="10" stroke="#185FA5" stroke-width="1.5"/>
    </g>
    <text class="label" x="245" y="342" fill="#0C447C">Housekeeping genes</text>
    <text class="sublabel" x="245" y="358">Neutral expression baseline</text>
    <g transform="translate(230, 396)">
      <path d="M-55,0 Q-28,-7 0,0 Q28,7 55,0" fill="none" stroke="#378ADD" stroke-width="1.8"/>
      <line x1="-60" y1="0" x2="60" y2="0" stroke="#185FA5" stroke-width="0.8"/>
    </g>
    <text class="sublabel" x="230" y="428">JS divergence k<tspan baseline-shift="sub" font-size="8">n</tspan></text>

    <rect x="340" y="316" width="220" height="132" rx="12" fill="#FAECE7" stroke="#F0997B" stroke-width="0.5"/>
    <g transform="translate(370, 344)">
      <path d="M-12,-8 Q0,0 12,-8" fill="none" stroke="#D85A30" stroke-width="1.2"/>
      <path d="M-12,-2 Q0,6 12,-2" fill="none" stroke="#D85A30" stroke-width="1.2"/>
      <path d="M-12,4 Q0,12 12,4" fill="none" stroke="#D85A30" stroke-width="1.2"/>
      <path d="M0,-22 L0,-4 M-5,-10 L0,-4 L5,-10" fill="none" stroke="#993C1D" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <text class="label" x="465" y="342" fill="#712B13">Functional genes</text>
    <text class="sublabel" x="465" y="358">Under selective pressure</text>
    <g transform="translate(450, 396)">
      <path d="M-55,8 Q-28,0 0,0 Q28,-8 55,0" fill="none" stroke="#F0997B" stroke-width="1.8"/>
      <path d="M-55,0 Q-28,-8 0,-8 Q28,0 55,-8" fill="none" stroke="#D85A30" stroke-width="1.8"/>
    </g>
    <text class="sublabel" x="450" y="428">JS divergence k<tspan baseline-shift="sub" font-size="8">f</tspan></text>

    <line x1="230" y1="448" x2="300" y2="485" stroke="#378ADD" stroke-width="1.2" marker-end="url(#arrow-blue)"/>
    <line x1="450" y1="448" x2="380" y2="485" stroke="#D85A30" stroke-width="1.2" marker-end="url(#arrow-coral)"/>

    <rect x="190" y="490" width="300" height="62" rx="16" fill="#EEEDFE" stroke="#7F77DD" stroke-width="1"/>
    <text class="formula" x="340" y="515">&#x3c9; = k<tspan baseline-shift="sub" font-size="14">f</tspan> / k<tspan baseline-shift="sub" font-size="14">n</tspan></text>
    <text class="sublabel" x="340" y="538" fill="#534AB7">&#x3c9; &gt; 1 &#x2192; functional selection exceeds neutral drift</text>

    <line x1="340" y1="552" x2="340" y2="566" stroke="#534AB7" stroke-width="1.2" marker-end="url(#arrow-purple)"/>

    <g transform="translate(340, 586)">
      <circle cx="-90" cy="0" r="14" fill="#FAEEDA" stroke="#EF9F27" stroke-width="0.5"/>
      <path d="M-90,-8 A8,8 0 1,1 -94,5" fill="none" stroke="#BA7517" stroke-width="1.5" stroke-linecap="round"/>
      <path d="M-88,5 L-94,5 L-92,11" fill="none" stroke="#BA7517" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      <text class="caption" x="-90" y="25">Bootstrap test</text>
      <line x1="-64" y1="0" x2="-18" y2="0" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>
      <polygon points="-12,-9 12,-9 0,9" fill="#FAEEDA" stroke="#EF9F27" stroke-width="0.5"/>
      <line x1="-8" y1="-3" x2="8" y2="-3" stroke="#BA7517" stroke-width="1"/>
      <text class="caption" x="0" y="25">FDR correction</text>
    </g>

    <line x1="340" y1="616" x2="340" y2="628" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>

    <rect x="115" y="634" width="120" height="32" rx="8" fill="#EAF3DE" stroke="#97C459" stroke-width="0.5"/>
    <text class="label" x="175" y="654">Strong</text>
    <rect x="280" y="634" width="120" height="32" rx="8" fill="#FAEEDA" stroke="#EF9F27" stroke-width="0.5"/>
    <text class="label" x="340" y="654">Moderate</text>
    <rect x="445" y="634" width="120" height="32" rx="8" fill="#FCEBEB" stroke="#F09595" stroke-width="0.5"/>
    <text class="label" x="505" y="654">Weak</text>
  </svg>
</body>
</html>
